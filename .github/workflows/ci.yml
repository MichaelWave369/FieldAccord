name: Field Accord Contracts, Durable Handoff and Native Source Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract, replay and attention negative-control tests
        run: python -m unittest discover -s tests -v
      - name: FA-01 synthetic review-only demonstration
        run: |
          python -m fieldaccord demo > receipt.json
          python -c 'import json; r=json.load(open("receipt.json")); assert r["decision"]=="REVIEW_REQUIRED" and r["authority_granted"] is False and r["action_executed"] is False'
      - name: FA-02 synthetic continuity and attention demonstration
        run: |
          python -m fieldaccord work-demo > work-demo.json
          python -c 'import json; r=json.load(open("work-demo.json")); s=r["work_state"]; a=r["attention_decision"]; assert s["status"]=="OPEN" and s["action_executed"] is False and s["authority_granted"] is False and s["notification_dispatched"] is False and a["decision"]=="REVIEW_CANDIDATE" and a["notification_dispatched"] is False and a["authority_granted"] is False'
      - name: FA-03 synthetic read-only bridge demonstration
        run: |
          python -m fieldaccord bridge-demo > bridge-demo.json
          python -c 'import json; r=json.load(open("bridge-demo.json")); assert r["disposition"]=="REVIEW_CANDIDATE" and r["provenance_authenticated"] is False and r["authority_granted"] is False and r["action_executed"] is False and r["notification_dispatched"] is False and r["history_modified"] is False and "task" not in str(r)'
      - name: FA-05 offline interop demonstration
        run: |
          python -m fieldaccord interop-demo > interop-demo.json
          python -c 'import json; r=json.load(open("interop-demo.json")); assert r["disposition"]=="REVIEW_CANDIDATE" and r["authority_granted"] is False and r["action_executed"] is False and r["memory_admitted"] is False and r["notification_dispatched"] is False and r["projection"]["context_items_admitted"] is False and r["source_identity_authenticated"] is False'
      - name: FA-06 offline durable HMAC handoff smoke
        run: |
          python -m fieldaccord handoff-demo > handoff-demo.json
          python -c 'import json; r=json.load(open("handoff-demo.json")); h=r["receipt"]; assert r["replay_blocked"] is True and r["resumed_status"]=="OPEN" and h["shared_key_verified"] is True and h["person_or_device_identity_authenticated"] is False and h["operator_consent_verified"] is False and h["authority_granted"] is False and h["action_executed"] is False and h["memory_admitted"] is False'
      - name: FA-07 metadata-only producer and journal smoke
        run: |
          python -m fieldaccord producer-demo > producer-demo.json
          python -c 'import json; r=json.load(open("producer-demo.json")); assert r["original_item_count"]==1 and r["derived_item_count"]==0 and r["metadata_only"] is True and r["shared_key_verified"] is True and r["operator_consent_verified"] is False and r["authority_granted"] is False and r["action_executed"] is False and r["memory_admitted"] is False'
      - name: FA-08 native sealed-packet smoke
        run: |
          python -m fieldaccord native-demo > native-demo.json
          python -c 'import json; r=json.load(open("native-demo.json")); assert r["native_seal_valid"] is True and r["original_item_count"]==1 and r["derived_item_count"]==0 and r["private_content_exported"] is False and r["source_identity_authenticated"] is False and r["authority_granted"] is False and r["action_executed"] is False'
      - name: JSON contract syntax check
        run: python -c 'import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path("contracts").rglob("*.json")]'

  manual-public-read:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Opt-in pinned FieldDeck public API read (no tokens or writes)
        run: |
          python -m fieldaccord fetch-fielddeck > verified-read.json
          python -c 'import json; r=json.load(open("verified-read.json")); assert r["source_kind"]=="fielddeck.manifest.v0.7" and r["authority_granted"] is False and r["action_executed"] is False and r["source_authorship_authenticated"] is False and r["projection"]["action_count"]>0'
